<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל הזמן של אביב</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        #calendar { max-width: 900px; margin: 20px auto; padding: 10px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden mt-10 p-6 border border-gray-200">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">היומן החכם שלי 🗓️</h1>

        <div style="text-align: center; margin-bottom: 24px;">
            <button onclick="loginToGoogle()" class="w-full bg-blue-500 text-white px-5 py-3 rounded-xl font-medium hover:bg-blue-600 transition shadow-md">
                התחבר עם Google Calendar 🔗
            </button>
        </div>

        <div class="mb-8 flex gap-2">
            <input type="text" id="taskTitle" aria-label="תיאור המשימה" placeholder="למשל: ללמוד למבחן ביום חמישי בבוקר בספרייה"
                   class="border border-gray-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <button onclick="addTask()"
                    class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700 transition min-w-[80px]">
                הוסף
            </button>
        </div>

        <div id="feedback" role="status" aria-live="polite" class="hidden rounded-lg p-4 mb-4 whitespace-pre-line"></div>
        <p class="text-sm text-gray-500 mb-3">משימות גמישות נבדקות עד 14 ימים קדימה. שינוי ידני נועל את השיבוץ; אפשר לבטל את הנעילה בחלון העריכה. השעות מוצגות לפי אזור הזמן של המכשיר.</p>
        <div id='calendar'></div>
        <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
            <div class="bg-white p-6 rounded-xl shadow-lg max-w-sm w-full max-h-[90vh] overflow-y-auto" dir="rtl" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <h3 class="text-xl font-bold mb-4 text-indigo-600" id="modalTitle">ערוך שיבוץ 🎯</h3>
                <input type="hidden" id="modalEventId">
                <div class="mb-3">
                    <label for="modalTimeMode" class="block text-sm text-gray-600 mb-1">סוג שעת היעד</label>
                    <select id="modalTimeMode" class="w-full border p-2 rounded-lg"><option value="fixed">שעה קבועה — חייב להתחיל בזמן</option><option value="preferred">שעה מועדפת — אפשר להזיז</option></select>
                    <label for="modalPreferredStart" class="block text-sm text-gray-600 mt-2">שעת יעד (לא חובה)</label>
                    <input type="time" id="modalPreferredStart" class="w-full border p-2 rounded-lg">
                </div>
                <label class="block mb-3 text-sm"><input type="checkbox" id="modalLocked"> שמור את השיבוץ בתכנון מחדש</label>
                <p id="modalError" role="alert" class="text-sm text-red-700 mb-3"></p>
                <div class="mb-3">
                    <label for="modalStart" class="block text-sm text-gray-600 mb-1 font-medium">התחלה:</label>
                    <input type="datetime-local" id="modalStart" class="w-full border p-2 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="mb-5">
                    <label for="modalEnd" class="block text-sm text-gray-600 mb-1 font-medium">סיום:</label>
                    <input type="datetime-local" id="modalEnd" class="w-full border p-2 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="flex justify-between items-center">
                    <button onclick="deleteFromModal()" class="text-red-500 hover:text-red-700 font-medium px-2">🗑️ מחק מהלו"ז</button>
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300">בטל</button>
                        <button onclick="saveFromModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">שמור שינויים</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="scheduleResults" class="hidden my-4 p-4 bg-amber-50 rounded-lg" aria-live="polite"></div>
        <h2 class="text-lg font-semibold text-gray-700 mt-8 mb-4">משימות שממתינות לשיבוץ:</h2>
        <div id="tasksList" class="space-y-3 mb-6">
            <p class="text-gray-400 text-center text-sm">טוען משימות...</p>
        </div>

        <div class="flex gap-3 mt-4">
            <button onclick="proposeSchedule()"
                    class="w-1/2 bg-indigo-500 text-white px-4 py-3 rounded-xl font-medium hover:bg-indigo-600 transition shadow-md flex justify-center items-center gap-2">
                <span>🎯</span> הצע שיבוץ ביומן
            </button>
            <button onclick="confirmSync()"
                    class="w-1/2 bg-green-500 text-white px-4 py-3 rounded-xl font-medium hover:bg-green-600 transition shadow-md flex justify-center items-center gap-2">
                <span>✅</span> סנכרן לגוגל
            </button>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let modalIsScheduled = false;
        let modalOriginalTimes = null;
        let modalOriginalPreferences = null;

        function loginToGoogle() { window.location.href = `${API_URL}/login`; }
        function element(tag, text, className = '') {
            const node = document.createElement(tag);
            node.textContent = text;
            node.className = className;
            return node;
        }
        function feedback(message, error = false) {
            const node = document.getElementById('feedback');
            node.textContent = message;
            node.className = `rounded-lg p-4 mb-4 whitespace-pre-line ${error ? 'bg-red-50 text-red-800' : 'bg-indigo-50 text-indigo-800'}`;
        }
        function errorText(data) {
            const detail = data.detail || data.error;
            if (Array.isArray(detail)) return detail.map(item => `${(item.loc || []).slice(1).join('.')}: ${item.msg}`).join('\n');
            return typeof detail === 'string' ? detail : JSON.stringify(detail || 'הפעולה נכשלה');
        }
        async function request(path, options = {}) {
            const response = await fetch(`${API_URL}${path}`, options);
            let data;
            try { data = await response.json(); }
            catch (_) { throw new Error(`השרת החזיר תשובה לא תקינה (${response.status})`); }
            if (!response.ok || data.error) throw new Error(errorText(data));
            return data;
        }
        function jsonOptions(method, data) {
            return {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)};
        }
        async function busy(button, label, action) {
            const text = button.textContent;
            button.disabled = true;
            button.textContent = label;
            try { await action(); }
            catch (error) { feedback(error.message || 'שגיאת רשת. נסה שוב.', true); }
            finally { button.disabled = false; button.textContent = text; }
        }
        async function refresh() {
            window.myCalendar.refetchEvents();
            await fetchTasks();
        }
        async function fetchTasks() {
            try {
                const tasks = await request('/tasks');
                const list = document.getElementById('tasksList');
                list.replaceChildren();
                if (!tasks.length) {
                    list.append(element('p', 'אין משימות שממתינות לשיבוץ.', 'text-gray-500 text-center text-sm'));
                    return;
                }
                const periods = {Morning: 'בוקר', Afternoon: 'צהריים', Evening: 'ערב', Any: 'בכל שעה'};
                tasks.forEach(task => {
                    const row = element('div', '', 'p-4 bg-gray-50 border rounded-xl flex flex-wrap gap-3 items-center');
                    const details = element('div', '', 'flex-1 min-w-0');
                    details.append(element('h3', task.title, 'font-medium text-gray-800'));
                    const target = task.target_date || (task.priority === 1 ? 'בהקדם מהיום' : 'ב-14 הימים הקרובים');
                    const time = task.preferred_start_time ? `${task.preferred_start_time} (${task.time_mode === 'preferred' ? 'מועדפת' : 'קבועה'})` : (periods[task.preferred_time] || 'בכל שעה');
                    details.append(element('p', `${target} | ${time} | ${task.duration_minutes} דקות`, 'text-sm text-gray-600 mt-1'));
                    details.append(element('p', task.location_context === 'Anywhere' ? 'בכל מקום' : `${task.location_context} (${task.estimated_transit_minutes} דקות נסיעה)`, 'text-sm text-indigo-600'));
                    if (task.unscheduled_reason) details.append(element('p', task.unscheduled_reason, 'text-sm text-amber-800 mt-2'));
                    const edit = element('button', 'ערוך זמן יעד', 'text-indigo-600 text-sm');
                    edit.onclick = () => openTaskPreferences(task);
                    const remove = element('button', 'מחק', 'text-red-600 text-sm');
                    remove.onclick = () => deleteTask(task.id, remove);
                    row.append(details, edit, remove);
                    list.append(row);
                });
            } catch (error) {
                feedback(`לא ניתן לטעון את המשימות: ${error.message}`, true);
            }
        }
        async function deleteTask(taskId, button) {
            if (!confirm('למחוק את המשימה?')) return;
            await busy(button, 'מוחק...', async () => {
                await request(`/tasks/${taskId}`, {method: 'DELETE'});
                closeModal();
                feedback('המשימה נמחקה.');
                await refresh();
            });
        }
        async function addTask() {
            const input = document.getElementById('taskTitle');
            const text = input.value.trim();
            if (!text) return;
            await busy(document.querySelector('button[onclick="addTask()"]'), 'מפענח...', async () => {
                const data = await request('/smart_add_task', jsonOptions('POST', {text}));
                if (input.value.trim() === text) input.value = '';
                feedback(data.message || 'המשימה נוספה. אפשר לערוך את שעת היעד לפני השיבוץ.');
                await fetchTasks();
            });
        }
        async function proposeSchedule() {
            await busy(document.querySelector('button[onclick="proposeSchedule()"]'), 'מתכנן...', async () => {
                const data = await request('/schedule_tasks', {method: 'POST'});
                feedback(`שובצו ${data.scheduled_count ?? 0} משימות. נשמרו ${data.locked_count ?? 0} שיבוצים נעולים.`);
                const results = document.getElementById('scheduleResults');
                results.replaceChildren();
                if (data.unscheduled && data.unscheduled.length) {
                    results.classList.remove('hidden');
                    results.append(element('h3', `${data.unscheduled.length} משימות לא שובצו`, 'font-semibold mb-2'));
                    const list = document.createElement('ul');
                    data.unscheduled.forEach(task => list.append(element('li', `${task.title}: ${task.reason}`, 'text-sm mb-1')));
                    results.append(list);
                } else results.classList.add('hidden');
                await refresh();
            });
        }
        async function confirmSync() {
            await busy(document.querySelector('button[onclick="confirmSync()"]'), 'מסנכרן...', async () => {
                const data = await request('/sync_to_google', {method: 'POST'});
                const failures = data.failed || [];
                const summary = `סונכרנו ${data.synced_count ?? 0} משימות.`;
                feedback(failures.length ? `${summary}\n${failures.length} משימות נכשלו. אפשר לנסות שוב; משימות שסונכרנו לא יוכפלו.\n${failures.map(task => `${task.title}: ${task.error}`).join('\n')}` : summary, !!failures.length);
                await refresh();
            });
        }
        function localInputValue(date) {
            // Use the offset at the event date, including daylight saving transitions.
            return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        }
        function populateModal(id, title, data, scheduled) {
            modalIsScheduled = scheduled;
            document.getElementById('modalEventId').value = id;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalTimeMode').value = data.time_mode || 'fixed';
            document.getElementById('modalPreferredStart').value = data.preferred_start_time || '';
            modalOriginalPreferences = {time_mode: data.time_mode || 'fixed', preferred_start_time: data.preferred_start_time || null};
            document.getElementById('modalTimeMode').disabled = scheduled;
            document.getElementById('modalPreferredStart').disabled = scheduled;
            document.getElementById('modalTimeMode').parentElement.classList.toggle('hidden', scheduled);
            document.getElementById('modalLocked').checked = !!data.locked;
            document.getElementById('modalLocked').closest('label').classList.toggle('hidden', !scheduled);
            ['modalStart', 'modalEnd'].forEach(id => document.getElementById(id).parentElement.classList.toggle('hidden', !scheduled));
            document.getElementById('modalError').textContent = '';
            document.getElementById('editModal').classList.remove('hidden');
        }
        function openTaskPreferences(task) { populateModal(task.id, task.title, task, false); }
        function openEditModal(event) {
            populateModal(event.id, event.title, event.extendedProps, true);
            document.getElementById('modalStart').value = localInputValue(event.start);
            document.getElementById('modalEnd').value = localInputValue(event.end);
            modalOriginalTimes = {start: localInputValue(event.start), end: localInputValue(event.end)};
        }
        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }
        async function saveFromModal() {
            const button = document.querySelector('button[onclick="saveFromModal()"]');
            const id = document.getElementById('modalEventId').value;
            const locked = document.getElementById('modalLocked').checked;
            const timeMode = document.getElementById('modalTimeMode').value;
            const preferredStart = document.getElementById('modalPreferredStart').value || null;
            const errorNode = document.getElementById('modalError');
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'שומר...';
            try {
                if (modalIsScheduled) {
                    const start = document.getElementById('modalStart').value;
                    const end = document.getElementById('modalEnd').value;
                    if (!start || !end || new Date(end) <= new Date(start)) throw new Error('יש להזין סיום מאוחר משעת ההתחלה.');
                    if (start !== modalOriginalTimes.start || end !== modalOriginalTimes.end) {
                        await request(`/tasks/${id}/time`, jsonOptions('PUT', {start_time: new Date(start).toISOString(), end_time: new Date(end).toISOString(), locked}));
                        modalOriginalTimes = {start, end};
                    } else {
                        await request(`/tasks/${id}/lock`, jsonOptions('PUT', {locked}));
                    }
                } else if (timeMode !== modalOriginalPreferences.time_mode || preferredStart !== modalOriginalPreferences.preferred_start_time) {
                    await request(`/tasks/${id}`, jsonOptions('PATCH', {time_mode: timeMode, preferred_start_time: preferredStart}));
                }
                closeModal();
                feedback('השינויים נשמרו.');
                await refresh();
            } catch (error) { errorNode.textContent = error.message; if (modalIsScheduled) window.myCalendar.refetchEvents(); }
            finally { button.disabled = false; button.textContent = originalText; }
        }
        async function deleteFromModal() {
            await deleteTask(document.getElementById('modalEventId').value, document.querySelector('button[onclick="deleteFromModal()"]'));
        }
        async function updateEventTimeOnServer(info) {
            if (!info.event.extendedProps.is_proposed || !info.event.end) { info.revert(); return; }
            try {
                await request(`/tasks/${info.event.id}/time`, jsonOptions('PUT', {start_time: info.event.start.toISOString(), end_time: info.event.end.toISOString(), locked: true}));
                info.event.setExtendedProp('locked', true);
                feedback('השיבוץ עודכן וננעל לתכנון הבא.');
                window.myCalendar.refetchEvents();
            } catch (error) { info.revert(); feedback(error.message, true); }
        }
        document.addEventListener('DOMContentLoaded', function() {
            ['modalStart', 'modalEnd'].forEach(id => document.getElementById(id).addEventListener('change', () => { document.getElementById('modalLocked').checked = true; }));
            document.getElementById('taskTitle').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.isComposing && !document.querySelector('button[onclick="addTask()"]').disabled) addTask(); });
            document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
            window.myCalendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: window.innerWidth < 640 ? 'timeGridDay' : 'timeGridWeek',
                headerToolbar: {left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay'},
                direction: 'rtl', height: 'auto', timeZone: 'local',
                events: async function(info, success, failure) {
                    try { success(await request(`/api/calendar/events?${new URLSearchParams({start: info.startStr, end: info.endStr})}`)); }
                    catch (error) { failure(error); feedback(`לא ניתן לטעון את היומן: ${error.message}`, true); }
                },
                editable: true,
                eventAllow: function(dropInfo, event) { return !!event.extendedProps.is_proposed; },
                eventDrop: updateEventTimeOnServer,
                eventResize: updateEventTimeOnServer,
                eventDidMount: function(info) { if (info.event.extendedProps.locked) info.el.title = 'שיבוץ נעול — נשמר בתכנון מחדש'; },
                eventClick: function(info) { if (info.event.extendedProps.is_proposed) openEditModal(info.event); }
            });
            window.myCalendar.render();
            fetchTasks();
        });
    </script>
</body>
</html>
